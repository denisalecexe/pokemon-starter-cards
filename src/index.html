<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/favicon/poke-fav.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Starter Card Pokemon (Gen 1)</title>
</head>
<body>
    <!-- HEADER DEL SITO -->
    <div id="header">
        <img class="logo" src="./assets/logo/pokemon-logo-pixel.png" alt="immagine in pixel art del logo di pokemon senza sfondo">
    </div>

    <!-- PAGINA CENTRALE DEL SITO PER LE CARTE -->
    <!-- contenitore della pagina centrale -->
    <div id="body-page-content">
        <!-- header della pagina centrale che introduce alla scelta del pokemon -->
        <div class="header-wrapper">
            <img class="character-header-wrapper" src="./assets/img/character-pixel.png" alt="immagine di un allenatore standard pokemon in pixel art senza sfondo">
            <p class="text-header-wrapper">Choose your starter pokemon:</p>
        </div>

        <!-- contenitore delle carte -->
        <div class="card-wrapper">
            <!-- contenitore img1 starter squirtle -->
            <div class="box-card squirtle">
                <p class="name-pokemon-card">Squirtle</p>
                <img class="card-img" src="./assets/img/squirtle-card.png" alt="immagine in pixel art di squirtle">
            </div>

            <!-- contenitore img2 starter charmander -->
            <div class="box-card charmander">
                <p class="name-pokemon-card">Charmander</p>
                <img class="card-img" src="./assets/img/charmander-card.png" alt="immagine in pixel art di charmander">
            </div>

            <!-- contenitore img3 starter bulbasaur -->
            <div class="box-card bulbasaur">
                <p class="name-pokemon-card">Bulbasaur</p>
                <img class="card-img" src="./assets/img/bulbasaur-card.png" alt="immagine in pixel art di bulbasaur">
            </div>

            <!-- contenitore img4 starter pikachu -->
            <div class="box-card pikachu">
                <p class="name-pokemon-card">Pikachu</p>
                <img class="card-img" src="./assets/img/pikachu-card.png" alt="immagine in pixel art di pikachu">
            </div>
        </div>
    </div>



    <script src="./js/script.js"></script>
</body>
</html>
